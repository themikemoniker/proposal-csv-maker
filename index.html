<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoice Proposal</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="p-6 space-y-8">
  <h1 class="text-3xl font-bold">Invoice Proposal</h1>

  <!-- Select Company -->
  <div class="flex gap-2 items-end">
    <label for="companySelect" class="font-semibold">Select Company:</label>
    <select id="companySelect" class="border p-2"></select>
  </div>

  <!-- Add New Company -->
  <div class="border p-4 rounded bg-gray-100">
    <h3 class="text-lg font-semibold mb-2">Add New Company</h3>
    <form id="newCompanyForm" class="flex flex-wrap gap-2 items-center">
      <input type="text" id="newCompanyName" placeholder="Company Name" class="border p-2" required>
      <input type="text" id="newCompanyAddress" placeholder="Company Address" class="border p-2" required>
      <input type="file" id="newCompanyLogo" accept="image/*" class="border p-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2">Add Company</button>
    </form>
  </div>

  <!-- Invoice Meta -->
  <div class="flex gap-4">
    <div>
      <label for="invoiceDate" class="block font-semibold">Invoice Date</label>
      <input type="date" id="invoiceDate" class="border p-2" />
    </div>
    <div>
      <label for="invoiceNumber" class="block font-semibold">Invoice Number</label>
      <input type="text" id="invoiceNumber" class="border p-2" placeholder="Optional" />
    </div>
  </div>

  <!-- Load / Save Catalogue -->
  <div class="space-x-4">
    <input type="file" id="catalogueFileInput" accept=".json" hidden />
    <button id="loadCatalogue" class="bg-purple-500 text-white px-4 py-2">Load Catalogue from File</button>
    <button id="saveCatalogue" class="bg-gray-600 text-white px-4 py-2">Save Catalogue to File</button>
  </div>

  <!-- Select Client -->
  <div class="mt-6">
    <label for="clientSelect" class="block mb-1 font-semibold">Select Client</label>
    <select id="clientSelect" class="border p-2">
      <option value="">-- Choose Client --</option>
    </select>
  </div>

  <!-- Add New Client -->
  <div class="mt-4 border p-4 rounded bg-gray-100">
    <h3 class="text-lg font-semibold mb-2">Add New Client</h3>
    <form id="newClientForm" class="flex flex-wrap gap-2 items-center">
      <input type="text" id="newClientName" placeholder="Name" class="border p-2" required>
      <input type="email" id="newClientEmail" placeholder="Email" class="border p-2" required>
      <button type="submit" class="bg-green-600 text-white px-4 py-2">Add</button>
    </form>
  </div>

  <!-- Add New Product -->
  <div class="border p-4 rounded bg-gray-100">
    <h3 class="text-xl font-semibold mb-2">Add New Product</h3>
    <form id="newProductForm" class="flex flex-wrap gap-2 items-center">
      <input type="text" id="newName" placeholder="Name" class="border p-2" required>
      <input type="text" id="newCategory" placeholder="Category" class="border p-2" required>
      <input type="number" id="newPrice" placeholder="Price" min="0" step="0.01" class="border p-2 w-24" required>
      <input type="file" id="newImage" accept="image/*" class="border p-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2">Add</button>
    </form>
  </div>

  <!-- Filter and Sort -->
  <div class="space-x-4">
    <select id="categoryFilter" class="border p-2">
      <option value="">All Categories</option>
    </select>
    <select id="sortBy" class="border p-2">
      <option value="name">Sort by Name</option>
      <option value="price">Sort by Price</option>
    </select>
  </div>

  <!-- Product List -->
  <div>
    <h2 class="text-2xl font-semibold">Catalogue</h2>
    <ul id="productList" class="space-y-4 mt-2"></ul>
  </div>

  <!-- Cart Summary -->
  <div>
    <h2 class="text-2xl font-semibold">Proposal (Cart)</h2>
    <ul id="cartList" class="space-y-2 mb-2"></ul>
    <p id="cartSubtotal" class="font-semibold">Subtotal: $0.00</p>
    <p id="cartTotal" class="font-semibold">Total (IVA 16%): $0.00</p>
  </div>

  <!-- Proposal Preview -->
  <div class="border p-4 rounded bg-white shadow">
    <h2 class="text-2xl font-semibold mb-2">Proposal Preview</h2>
    <div id="proposalPreview" class="text-sm"></div>
    <div class="flex gap-4 mt-4">
      <button onclick="printProposal()" class="bg-blue-700 text-white px-4 py-2">Print</button>
      <!-- <button onclick="downloadPDF()" class="bg-green-700 text-white px-4 py-2">Download PDF</button> -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
